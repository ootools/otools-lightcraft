<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>LightCraft</title>
  <link data-trunk rel="rust" data-bin="otools-lightcraft" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="copy-file" href="favicon.svg" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    /* #1c1c1c 是 LightCraft 默认 Charcoal 暗黑主题的画布色，加载页先垫同色避免闪白 */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1c; }
    #lightcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #lightcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px/1.5 system-ui, sans-serif; pointer-events: none; }
    #lightcraft_status { position: absolute; bottom: 8px; left: 12px; right: 12px; color: #ff8a7a;
      font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; pointer-events: auto; }
  </style>
  <script>
    /*
     * OTools 宿主桥（插件唯一需要写的 JS）。
     * ------------------------------------------------------------------
     * 上游 LightCraft 的网页版把「照片原图 / 目录 / 缩略图 / 偏好」存在浏览器存储
     * （OPFS / IndexedDB，见 shell/src/{backend,store,files}.rs），这部分插件里原样保留；
     * 只有「从哪里导入照片」「导出到哪里」需要换：导入弹 OTools 宿主的打开对话框，
     * 导出交给宿主的另存对话框写真实磁盘（上游网页版是浏览器下载）。
     * WASM 侧（shell/src/otools.rs）通过 wasm-bindgen 直接调下面这几个函数。
     *
     * 宿主能力有两条路，任一条通就算「在 OTools 里」：
     *   1. `window.otools` / `window.utools`：宿主注入的包装 API
     *      （dialog.open/save + readHostFile/writeHostFile）。
     *   2. `window.__TAURI_INTERNALS__.invoke`：Tauri 原生 IPC，可直接调
     *      `tools_webview_pick_files` / `tools_webview_read_file` /
     *      `tools_webview_pick_save_path` / `tools_webview_write_file`。
     * 两条路都不通（把 dist 拖进普通浏览器）也能跑：导入退回拖放，导出无对话框可弹，
     * 日志会说明；库本身仍持久化在浏览器存储里。
     *
     * 注意 write_file 的参数形状：`tools_webview_write_file(request: WebviewWriteFileRequest)`
     * 收的是名为 `request` 的结构体，平铺 `{path, dataBase64}` 会被拒掉。
     *
     * 不依赖 otools-plugin-sdk：插件是纯 Rust/WASM 应用，没有前端打包环节。
     */
    (function () {
      var NAME_MAP_KEY = 'lightcraft.otools.paths';
      var DIAG_KEY = 'lightcraft.otools.diag';
      var LOG_KEY = 'lightcraft.otools.logs';

      // 错误日志环：宿主 webview 里没有 devtools，把最近的报错留在 localStorage
      // （自动化/无头调试可取回；只收 error/warn 与未捕获异常，最多 40 条）。
      function logRing(level, message) {
        try {
          var logs = [];
          try { logs = JSON.parse(window.localStorage.getItem(LOG_KEY) || '[]') || []; } catch (e) { logs = []; }
          logs.push({ at: new Date().toISOString(), level: level, message: String(message).slice(0, 500) });
          while (logs.length > 40) logs.shift();
          window.localStorage.setItem(LOG_KEY, JSON.stringify(logs));
        } catch (e) { /* 配额不足：只影响排障 */ }
      }
      window.lightcraftOtoolsLogs = function () {
        try { return JSON.parse(window.localStorage.getItem(LOG_KEY) || '[]'); } catch (e) { return []; }
      };
      window.addEventListener('error', function (e) { logRing('error', (e && e.message) || e); });
      window.addEventListener('unhandledrejection', function (e) { logRing('rejection', e && e.reason); });
      (function () {
        var origError = console.error.bind(console);
        var origWarn = console.warn.bind(console);
        console.error = function () { logRing('error', Array.prototype.map.call(arguments, String).join(' ')); origError.apply(null, arguments); };
        console.warn = function () { logRing('warn', Array.prototype.map.call(arguments, String).join(' ')); origWarn.apply(null, arguments); };
      })();

      function baseName(p) {
        var s = String(p || '');
        var i = Math.max(s.lastIndexOf('/'), s.lastIndexOf('\\'));
        return i >= 0 ? s.slice(i + 1) : s;
      }

      // 「文件名 -> 上次真实落盘路径」的映射，让再次导出同名文件不再弹对话框。
      function loadMap() {
        try { return JSON.parse(window.localStorage.getItem(NAME_MAP_KEY) || '{}') || {}; } catch (e) { return {}; }
      }
      function saveMap(map) {
        try { window.localStorage.setItem(NAME_MAP_KEY, JSON.stringify(map)); } catch (e) { /* 忽略 */ }
      }

      function diag(patch) {
        try {
          var d = JSON.parse(window.localStorage.getItem(DIAG_KEY) || '{}') || {};
          for (var k in patch) d[k] = patch[k];
          d.at = new Date().toISOString();
          window.localStorage.setItem(DIAG_KEY, JSON.stringify(d));
        } catch (e) { /* 忽略 */ }
      }

      function fail(message) { return Promise.reject(new Error(message)); }

      // 无宿主时的最近一次导出暂存（自动化/无头调试用；base64 太大就放弃，不影响下载）。
      function stash(name, dataBase64) {
        try {
          if (!dataBase64 || dataBase64.length > 4 * 1024 * 1024) return;
          window.localStorage.setItem('lightcraft.otools.lastSave', JSON.stringify({ name: name, dataBase64: dataBase64, at: new Date().toISOString() }));
        } catch (e) { /* 配额不足：只影响调试暂存 */ }
      }

      // 无宿主时的导出回退：上游网页版的浏览器下载。
      function browserDownload(name, dataBase64) {
        try {
          var bin = atob(dataBase64);
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          var blob = new Blob([bytes]);
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = name;
          a.click();
          setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
        } catch (e) { /* 下载失败只影响无宿主场景 */ }
      }

      function wrapper() {
        var a = (typeof window !== 'undefined' && (window.otools || window.utools)) || null;
        return a && a.dialog && typeof a.dialog.open === 'function' && typeof a.readHostFile === 'function' ? a : null;
      }

      function tauriInvoke() {
        var candidates = [window];
        try { if (window.parent && window.parent !== window) candidates.push(window.parent); } catch (e) { /* 跨域，忽略 */ }
        try { if (window.top && window.top !== window) candidates.push(window.top); } catch (e) { /* 跨域，忽略 */ }
        for (var i = 0; i < candidates.length; i++) {
          var t = candidates[i] && candidates[i].__TAURI_INTERNALS__;
          if (t && typeof t.invoke === 'function') return t.invoke.bind(t);
        }
        return null;
      }

      function hostReady() { return !!wrapper() || !!tauriInvoke(); }

      function firstPath(picked) {
        if (Array.isArray(picked)) return picked.length ? picked[0] : null;
        if (picked && typeof picked === 'object' && typeof picked.path === 'string') return picked.path.trim() || null;
        return typeof picked === 'string' ? (picked.trim() || null) : null;
      }

      /** Rust 传来的 extensions 数组 → 宿主对话框的 filters 形状。 */
      function toFilters(request) {
        var exts = (request && request.extensions) || [];
        if (!exts.length) return undefined;
        return [{ name: (request && request.title) || '文件', extensions: exts }];
      }

      function pickOpenPath(request) {
        var filters = toFilters(request);
        var title = (request && request.title) || '打开文件';
        var a = wrapper();
        if (a) return a.dialog.open({ directory: false, multiple: false, title: title, filters: filters }).then(firstPath);
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 宿主不可用');
        return invoke('tools_webview_pick_files', { options: { multiple: false, title: title, filters: filters } }).then(function (files) {
          var list = Array.isArray(files) ? files : (files ? [files] : []);
          var first = list[0];
          if (!first) return null;
          return typeof first === 'string' ? first.trim() || null : (first.path ? String(first.path).trim() || null : null);
        });
      }

      function readHostFile(path) {
        var a = wrapper();
        if (a) return a.readHostFile(path);
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 宿主不可用');
        return invoke('tools_webview_read_file', { path: path });
      }

      function writeHostFile(path, dataBase64) {
        var invoke = tauriInvoke();
        if (invoke) {
          return invoke('tools_webview_write_file', { request: { path: path, dataBase64: dataBase64 } }).catch(function (rawError) {
            var a = wrapper();
            if (a && typeof a.writeHostFile === 'function') return a.writeHostFile({ path: path, dataBase64: dataBase64 });
            throw rawError;
          });
        }
        var a = wrapper();
        if (a && typeof a.writeHostFile === 'function') return a.writeHostFile({ path: path, dataBase64: dataBase64 });
        return fail('OTools 宿主不可用');
      }

      function splitPath(p) {
        var s = String(p || '').trim();
        if (!s) return { directory: undefined, fileName: undefined };
        var m = s.match(/^(.*[\\/])([^\\/]+)$/);
        if (!m) return { directory: undefined, fileName: s };
        return { directory: m[1].replace(/[\\/]+$/, '') || undefined, fileName: m[2].trim() || undefined };
      }

      function pickSavePath(defaultPath, title) {
        var filters = [
          { name: '图片导出', extensions: ['jpg', 'jpeg', 'png', 'tif', 'tiff', 'webp', 'dng'] },
          { name: '预设与数据', extensions: ['lcpreset', 'xmp', 'lrtemplate', 'zip', 'lmp', 'mplumpack', 'txt', 'utf8', 'json', 'lccurve', 'gpx'] },
        ];
        var a = wrapper();
        if (a) return a.dialog.save({ title: title, defaultPath: defaultPath, filters: filters }).then(firstPath);
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 宿主不可用');
        var sp = splitPath(defaultPath);
        return invoke('tools_webview_pick_save_path', {
          options: { title: title, suggestedName: sp.fileName, directory: sp.directory, filters: filters },
        }).then(function (meta) {
          if (!meta) return null;
          return typeof meta === 'string' ? meta.trim() || null : (meta.path ? String(meta.path).trim() || null : null);
        });
      }

      window.lightcraftOtools = {
        available: function () {
          var a = wrapper();
          if (a) { diag({ bridge: 'wrapper', host: true }); return true; }
          var raw = !!tauriInvoke();
          if (raw) {
            diag({ bridge: 'raw', host: true });
            try { console.warn('[lightcraftOtools] window.otools 包装缺失，改用 Tauri IPC 直连 tools_webview_* 命令'); } catch (e) { /* 忽略 */ }
          } else {
            diag({ bridge: 'none', host: false });
          }
          return raw;
        },

        // 宿主界面语言（BCP 47，如 zh-CN）。OTools 在插件 webview 里注入
        // `window.__OTOOLS_LOCALE__` 并同步 `document.documentElement.lang`，
        // 切换语言时派发 `otools-locale-changed` 事件。LightCraft 的界面语言
        // 由 wasm 侧在首帧和语言切换事件后写进 `ui.language`。
        language: function () {
          try {
            var l =
              (window.__OTOOLS_LOCALE__ && window.__OTOOLS_LOCALE__.locale) ||
              (document.documentElement && document.documentElement.lang) ||
              (typeof navigator !== 'undefined' && navigator.language) ||
              '';
            return l || '';
          } catch (e) { return ''; }
        },

        /**
         * 打开文件：弹宿主的打开对话框，读取选中的照片/工程。
         * @param {{title?: string, extensions?: string[]}} request
         * @returns {Promise<Array<{name: string, path: string, dataBase64: string}>>}
         */
        openFiles: function (request) {
          if (!hostReady()) return fail('OTools 打开文件对话框不可用');
          return pickOpenPath(request).then(function (path) {
            if (!path) return [];
            return readHostFile(path).then(function (file) {
              var name = (file && file.name) || baseName(path);
              diag({ lastOpen: path });
              return [{ name: name, path: path, dataBase64: (file && file.dataBase64) || '' }];
            });
          });
        },

        /**
         * 保存文件（导出）：宿主在时弹另存对话框（同名文件用上次的落盘路径直接覆盖）；
         * 宿主不在（浏览器直开 dist）时退回上游网页版的「浏览器下载」，并把最近一次的
         * base64 暂存进 localStorage（`lightcraft.otools.lastSave`，≤4MB）——控制通道的
         * `ui.screenshot` 等命令走这条路，自动化/无头调试可以从这里取回产物。
         * @param {{name: string, dataBase64: string}} request
         * @returns {Promise<{path: string}|null>}
         */
        saveFile: function (request) {
          var req = request || {};
          var name = String(req.name || 'Export.jpg');
          if (!hostReady()) {
            stash(name, req.dataBase64);
            browserDownload(name, req.dataBase64);
            return Promise.resolve({ path: name });
          }

          var map = loadMap();
          var known = map[name];
          if (known) {
            return writeHostFile(known, req.dataBase64).then(function () {
              diag({ lastSave: known, lastSaveMode: 'overwrite' });
              return { path: known };
            });
          }
          return pickSavePath(known || name, '导出文件').then(function (path) {
            if (!path) return null;
            map[name] = path;
            saveMap(map);
            return writeHostFile(path, req.dataBase64).then(function () {
              diag({ lastSave: path, lastSaveMode: 'dialog' });
              return { path: path };
            });
          });
        }
      };
      window.lightcraftOtools.available();
    })();
  </script>
</head>
<body>
  <canvas id="lightcraft_canvas"></canvas>
  <div id="lightcraft_loading">正在加载 LightCraft…</div>
  <div id="lightcraft_status"></div>
</body>
</html>
