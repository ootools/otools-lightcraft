# LightCraft 的 OTools 插件 native 适配层。
#
# 上游 `crates/mcp` 已经有完整的 headless 后端（进程内 Session，无窗口）和公开
# `Server`。本 crate 只做宿主 ABI 适配，不复制业务逻辑。
#
# 独立 workspace：上游 workspace 面向 GUI / wasm，并进来会把 UI 依赖带进插件构建。
[package]
name = "otools-lightcraft-native"
description = "LightCraft as an OTools plugin: persistent headless MCP backend over the upstream lightcraft-mcp crate"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
name = "otools_lightcraft_native"

[dependencies]
lightcraft-mcp = { path = "../upstream/crates/mcp" }
serde_json = "1"

# cdylib 必须可 unwind：插件 FFI 边界在插件内部捕获 panic，
# 若 release profile 设成 abort，宿主会整体被杀。
[profile.release]
panic = "unwind"
opt-level = 3
# Thin LTO keeps the 35 MB dylib smaller. The macOS build still needs
# scripts/fix-macho-linkedit-alignment.mjs before codesign: the linker can
# emit a symbol string pool at a 4-byte (not 8-byte) offset for this crate.
lto = "thin"
codegen-units = 16
